[project]
name = "new-life-training-center"
version = "1.0.0"
description = "New Life Training Center - Telegram bot + staff web dashboard"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.14",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "SQLAlchemy-Utils>=0.41.2",
    "pytz>=2024.2",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    "bcrypt>=4.2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-telegram-bot>=21.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[alembic]
script_location = migrations
prepend_sys_path = .
template = generic
sqlalchemy.url = sqlite+aiosqlite:///.new_life.db

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5s %(name)s %(message)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
